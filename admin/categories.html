<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestion des categories de produits CareMeal.">
  <title>Categories - CareMeal Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"><img src="../assets/logo.png" alt="Logo" style="max-width: 100%; max-height: 100%; object-fit: contain;"></div>
        <div class="sidebar-brand">Care<span>Meal</span></div>
      </div>
      <nav class="sidebar-nav">
        <div class="sidebar-section">
          <div class="sidebar-section-title">Administration</div>
          <a href="dashboard.html" class="sidebar-link"><span class="link-icon"><i class="fa-solid fa-chart-column"></i></span> Vue globale</a>
          <a href="users.html" class="sidebar-link"><span class="link-icon"><i class="fa-solid fa-users"></i></span> Utilisateurs</a>
          <a href="partners.html" class="sidebar-link"><span class="link-icon"><i class="fa-solid fa-store"></i></span> Partenaires</a>
          <a href="categories.html" class="sidebar-link active"><span class="link-icon"><i class="fa-solid fa-layer-group"></i></span> Categories</a>
          <a href="products.html" class="sidebar-link"><span class="link-icon"><i class="fa-solid fa-bowl-food"></i></span> Produits</a>
          <a href="events.html" class="sidebar-link"><span class="link-icon"><i class="fa-solid fa-calendar-day"></i></span> Evenements</a>
          <a href="logs.html" class="sidebar-link"><span class="link-icon"><i class="fa-solid fa-clipboard-list"></i></span> Logs d'activite</a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar" id="sidebar-user-avatar" style="background:linear-gradient(135deg,#EF4444,#F87171);">A</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-user-name">Admin</div>
            <div class="sidebar-user-role" id="sidebar-user-role">Administrateur</div>
          </div>
          <button class="sidebar-logout" data-action="logout" title="Deconnexion"><i class="fa-solid fa-door-open"></i></button>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="menu-toggle" id="menu-toggle"><i class="fa-solid fa-bars"></i></button>
          <div class="page-title"><h2>Categories</h2><p>Gestion des familles de produits</p></div>
        </div>
        <div class="header-right">
          <button class="btn btn-primary btn-sm" onclick="Admin.openCategoryModal()"><i class="fa-solid fa-plus"></i> Nouvelle categorie</button>
        </div>
      </header>

      <div class="page-content">
        <div class="grid grid-2 gap-4 mb-6 animate-fade-in-up">
          <div class="card" style="display:flex;align-items:center;gap:12px;">
            <div class="stat-icon blue"><i class="fa-solid fa-layer-group"></i></div>
            <div><div class="stat-value" id="categories-total">0</div><div class="stat-label">Categories total</div></div>
          </div>
          <div class="card" style="display:flex;align-items:center;gap:12px;">
            <div class="stat-icon green"><i class="fa-solid fa-check"></i></div>
            <div><div class="stat-value" id="categories-active">0</div><div class="stat-label">Categories actives</div></div>
          </div>
        </div>

        <div class="card animate-fade-in-up">
          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Nom</th>
                  <th>Description</th>
                  <th>Produits</th>
                  <th>Statut</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="categories-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="category-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="category-modal-title">Nouvelle categorie</h3>
        <button class="modal-close" data-close-modal="category-modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <form id="category-form" onsubmit="Admin.saveCategory(event)">
          <input type="hidden" id="category-id">
          <div class="form-group">
            <label for="category-name">Nom</label>
            <input id="category-name" class="form-input" required>
          </div>
          <div class="form-group">
            <label for="category-description">Description</label>
            <textarea id="category-description" class="form-textarea no-icon" rows="3"></textarea>
          </div>
          <label class="form-check" style="margin-bottom:12px;">
            <input type="checkbox" id="category-active" checked>
            <span>Active</span>
          </label>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-close-modal="category-modal">Annuler</button>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/admin.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => Admin.initCategories());</script>
</body>
</html>
