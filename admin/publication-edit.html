<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Modifier une publication CareMeal en tant qu'administrateur.">
  <title>Modifier une publication — CareMeal Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/publications.css">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"><img src="../assets/logo.png" alt="Logo" style="max-width: 100%; max-height: 100%; object-fit: contain;"></div>
        <div class="sidebar-brand">Care<span>Meal</span></div>
      </div>
      <nav class="sidebar-nav">
        <div class="sidebar-section">
          <div class="sidebar-section-title">Administration</div>
          <a href="dashboard.html" class="sidebar-link"><span class="link-icon"><i class="fa-solid fa-house"></i></span> Tableau de bord</a>
          <a href="users.html" class="sidebar-link"><span class="link-icon"><i class="fa-solid fa-users"></i></span> Utilisateurs</a>
          <a href="partners.html" class="sidebar-link"><span class="link-icon"><i class="fa-solid fa-store"></i></span> Partenaires</a>
          <a href="publications.html" class="sidebar-link"><span class="link-icon"><i class="fa-solid fa-pen-nib"></i></span> Publications</a>
          <a href="events.html" class="sidebar-link"><span class="link-icon"><i class="fa-solid fa-calendar-day"></i></span> Événements</a>
          <a href="logs.html" class="sidebar-link"><span class="link-icon"><i class="fa-solid fa-list-check"></i></span> Logs</a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar" id="sidebar-user-avatar">A</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-user-name">Admin</div>
            <div class="sidebar-user-role" id="sidebar-user-role">Administrateur</div>
          </div>
          <button class="sidebar-logout" data-action="logout" title="Déconnexion"><i class="fa-solid fa-door-open"></i></button>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="menu-toggle" id="menu-toggle"><i class="fa-solid fa-bars"></i></button>
          <div class="page-title">
            <h2><i class="fa-solid fa-pen-to-square" style="color:var(--color-primary);margin-right:8px;"></i>Modifier une publication</h2>
            <p>Éditez le texte et l'image puis revenez au fil</p>
          </div>
        </div>
        <div class="header-right">
          <button class="header-notification">
            <i class="fa-solid fa-bell"></i>
            <span class="notif-dot"></span>
          </button>
          <div class="avatar avatar-sm" id="header-avatar">A</div>
        </div>
      </header>

      <div class="page-content" style="max-width:720px;">
        <div class="pub-admin-back-wrap">
          <a href="publications.html" class="btn btn-outline btn-sm">
            <i class="fa-solid fa-arrow-left"></i> Retour aux publications
          </a>
        </div>

        <div class="pub-edit-page" id="pub-edit-page-root">
          <div class="pub-edit-modal-header">
            <h3><i class="fa-solid fa-pen-to-square"></i> Modifier la publication</h3>
          </div>
          <div class="pub-edit-modal-body">
            <textarea class="pub-edit-textarea" id="pub-edit-content" rows="5" oninput="Publications.updateCharCount(this, 'pub-edit-char-count', 500)"></textarea>
            <div style="text-align: right; margin-top: 4px;">
              <span id="pub-edit-char-count" style="font-size:0.85rem; color:#6b7280; font-weight: 500;">0 / 500</span>
            </div>

            <div class="pub-upload-block pub-upload-block-edit">
              <div class="pub-compose-upload-row" style="margin-top: 12px;">
                <label for="pub-edit-image" class="pub-upload-btn">
                  <i class="fa-regular fa-image"></i> Remplacer l'image
                </label>
                <input type="file" id="pub-edit-image" class="pub-compose-file-input" accept="image/jpeg,image/png,image/webp,image/gif">
              </div>
              <div class="pub-upload-meta" id="pub-edit-upload-meta">JPG, PNG, WEBP ou GIF • 5 Mo max</div>
              <div class="pub-compose-preview" id="pub-edit-image-preview" style="display:none;"></div>
            </div>

            <label class="pub-edit-remove-image" id="pub-edit-remove-wrap" style="display:none;">
              <input type="checkbox" id="pub-edit-remove-image">
              Retirer l'image actuelle
            </label>

            <p class="pub-edit-status" id="pub-edit-page-status"></p>
          </div>
          <div class="pub-edit-modal-footer">
            <a href="publications.html" class="btn btn-secondary btn-sm">Annuler</a>
            <button type="button" class="btn btn-primary btn-sm" id="pub-edit-page-save">
              <i class="fa-solid fa-check"></i> Enregistrer
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js?v=5"></script>
  <script src="../js/components.js?v=5"></script>
  <script src="../js/publications.js?v=5"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!App.requireAuth(['admin'])) return;
      Publications.initEditPage();
    });
  </script>
</body>
</html>
