<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Événements — Étudiant</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"><img src="../assets/logo.png" alt="Logo" style="max-width: 100%; max-height: 100%; object-fit: contain;"></div>
        <div class="sidebar-brand">Care<span>Meal</span></div>
      </div>
      <nav class="sidebar-nav">
        <div class="sidebar-section">
          <div class="sidebar-section-title">Menu</div>
          <a href="dashboard.html" class="sidebar-link">
            <span class="link-icon"><i class="fa-solid fa-house"></i></span> Accueil
          </a>
          <a href="profile.html" class="sidebar-link">
            <span class="link-icon"><i class="fa-solid fa-user"></i></span> Mon Profil
          </a>
          <a href="preferences.html" class="sidebar-link">
            <span class="link-icon"><i class="fa-solid fa-utensils"></i></span> Préférences
          </a>
          <a href="events.html" class="sidebar-link active">
            <span class="link-icon"><i class="fa-solid fa-calendar-day"></i></span> Événements
          </a>
          <a href="orders.html" class="sidebar-link">
            <span class="link-icon"><i class="fa-solid fa-box"></i></span> Mes Commandes
          </a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar" id="sidebar-user-avatar">E</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-user-name">Étudiant</div>
            <div class="sidebar-user-role" id="sidebar-user-role">Étudiant</div>
          </div>
          <button class="sidebar-logout" data-action="logout" title="Déconnexion"><i class="fa-solid fa-door-open"></i></button>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="menu-toggle" id="menu-toggle"><i class="fa-solid fa-bars"></i></button>
          <div class="page-title">
            <h2>Événements & Ateliers</h2>
            <p>Participez à la lutte anti-gaspillage</p>
          </div>
        </div>
      </header>

      <div class="page-content">
        <!-- Stats/KPIs -->
        <div class="stats-grid" style="display:flex; gap:16px; margin-bottom:24px; flex-wrap:wrap;">
          <div class="card" style="flex:1; min-width:200px; padding:16px; text-align:center;">
            <h3 id="stat-available" style="font-size:1.8rem; margin-bottom:4px; color:var(--color-primary);">0</h3>
            <span style="font-size:0.85rem; color:var(--color-text-muted);">Événements disponibles</span>
          </div>
          <div class="card" style="flex:1; min-width:200px; padding:16px; text-align:center;">
            <h3 id="stat-subscribed" style="color:var(--color-success); font-size:1.8rem; margin-bottom:4px;">0</h3>
            <span style="font-size:0.85rem; color:var(--color-text-muted);">Mes Inscriptions</span>
          </div>
          <div class="card" style="flex:1; min-width:200px; padding:16px; text-align:center;">
            <h3 id="stat-full" style="color:var(--color-warning); font-size:1.8rem; margin-bottom:4px;">0</h3>
            <span style="font-size:0.85rem; color:var(--color-text-muted);">Événements Complets</span>
          </div>
        </div>

        <!-- Filter/Tabs -->
        <div style="margin-bottom:24px; display:flex; gap:12px;">
          <button id="btn-filter-all" class="btn btn-primary" onclick="EventsStudent.setFilter('all')"><i class="fa-solid fa-list"></i> Tous les événements</button>
          <button id="btn-filter-my" class="btn btn-outline" onclick="EventsStudent.setFilter('my')"><i class="fa-solid fa-check-double"></i> Mes inscriptions</button>
        </div>

        <!-- Events Grid -->
        <div class="grid gap-6 animate-fade-in-up" id="events-container" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));">
          <!-- Populated by JS -->
        </div>

      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/events-student.js"></script>
</body>
</html>
